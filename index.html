<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="League of Legends live matches, prediction market analytics, and Twitch clips. All in one place.">
    <meta name="theme-color" content="#0b0b10">
    <meta property="og:title" content="chiwawinha · Projects">
    <meta property="og:description" content="Live matches, your trading results, and your favorite clips.">
    <title>chiwawinha · Projects</title>
    <link rel="canonical" href="https://chiwawinha.github.io/">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%238b7cf8'/%3E%3Cpath d='M43 20a17 17 0 1 0 0 24' fill='none' stroke='white' stroke-width='7'/%3E%3C/svg%3E">
    <script>
      // Keep bookmarked match links working after moving Esports Live.
      if (window.location.hash.startsWith('#/live/')) {
        window.location.replace('/lol/' + window.location.search + window.location.hash);
      }
    </script>
    <style>
      :root { color-scheme: dark; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0b0b10; color: #f3f2f7; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 48px 24px; }
      main { width: 100%; max-width: 680px; }
      .brand { color: #a99aef; font-size: 14px; font-weight: 650; letter-spacing: .04em; margin: 0 0 32px; }
      h1 { font-size: clamp(32px, 6vw, 44px); font-weight: 650; letter-spacing: -.04em; line-height: 1.15; margin: 0 0 14px; }
      .intro { color: #aaa8b8; line-height: 1.6; margin: 0 0 36px; }
      nav { display: grid; gap: 12px; }
      .project { color: inherit; text-decoration: none; display: grid; grid-template-columns: 48px minmax(0, 1fr) 24px; gap: 20px; align-items: center; padding: 24px; background: #13131c; border: 1px solid #292835; border-radius: 16px; transition: border-color .15s, background .15s; }
      .project:hover { background: #1a1925; border-color: #7f70c2; }
      .project:focus-visible { outline: 3px solid #b5a6ff; outline-offset: 4px; }
      .icon { display: grid; place-items: center; width: 48px; height: 48px; border-radius: 12px; background: #20232a; color: #90d7d0; }
      .pnl .icon { background: #252039; color: #b9a3ff; }
      .twitch .icon { background: #2b2035; color: #d0a3ff; }
      svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
      h2 { font-size: 18px; font-weight: 600; margin: 0 0 6px; letter-spacing: -.02em; }
      .description { color: #aaa8b8; font-size: 14px; line-height: 1.5; margin: 0; }
      .arrow { color: #858196; }
      footer { margin-top: 32px; color: #777385; font-size: 12px; }
      @media (max-width: 440px) { body { padding: 36px 20px; } .project { padding: 20px 16px; gap: 14px; grid-template-columns: 40px minmax(0, 1fr) 20px; } .icon { width: 40px; height: 40px; } }
      @media (prefers-reduced-motion: reduce) { .project { transition: none; } }
    </style>
  </head>
  <body>
    <main>
      <header>
        <p class="brand">chiwawinha</p>
        <h1>Everything in one place.</h1>
        <p class="intro">Pick a project to get started.</p>
      </header>
      <nav aria-label="Projects">
        <a class="project lol" href="/lol/">
          <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m4 4 16 16M20 4 4 20M3 3l5 1-4 4-1-5ZM21 3l-5 1 4 4 1-5ZM3 17l4 4M17 21l4-4"/></svg></span>
          <div><h2>LoL · Esports Live</h2><p class="description">League of Legends live matches and schedules.</p></div>
          <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>
        </a>
        <a class="project pnl" href="/pnl/">
          <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 4v16h16M8 14l4-4 4 2 5-7"/></svg></span>
          <div><h2>PnL Workbench</h2><p class="description">Trading analytics for Kalshi, Polymarket, and Predict.fun.</p></div>
          <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>
        </a>
        <a class="project twitch" href="/twitch/">
          <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m10 9 5 3-5 3V9Z"/></svg></span>
          <div><h2>Twitch Clip Hub</h2><p class="description">Browse and watch Twitch clips.</p></div>
          <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>
        </a>
      </nav>
      <footer>chiwawinha.github.io</footer>
    </main>
  </body>
</html>
